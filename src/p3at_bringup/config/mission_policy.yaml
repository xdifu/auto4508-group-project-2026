policies:
  - id: default
    goal_offset:
      lateral: 1.2
      longitudinal: 1.2
    arrival_overrides:
      confirm_frames: 3

  - id: weave_through_cones
    goal_offset:
      lateral: 0.9
      longitudinal: 1.0
    controller_overrides:
      lookahead_distance: 0.45
      max_linear_speed: 0.25
      collision_lookahead_time: 1.3
    local_costmap_overrides:
      inflation_layer:
        inflation_radius: 0.35
        cost_scaling_factor: 6.0
    arrival_overrides:
      confirm_frames: 4

  - id: default_marker
    goal_offset:
      lateral: 1.3
      longitudinal: 1.0
    arrival_overrides:
      confirm_frames: 3

  - id: final_return
    goal_offset:
      lateral: 0.0
      longitudinal: 0.3
    arrival_overrides:
      radius: 1.0
      confirm_frames: 2
